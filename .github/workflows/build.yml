name: build-probe
on:
  push:
    branches: [main, master, vulkan-probe]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Vulkan headers (from repo tarball)
        shell: pwsh
        run: |
          $url = "https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v1.4.313.0.tar.gz"
          Write-Host "Downloading..."
          Invoke-WebRequest -Uri $url -OutFile vk.tar.gz -TimeoutSec 120
          tar xzf vk.tar.gz
          $dir = "Vulkan-Headers-1.4.313.0"
          echo "VK_INCLUDE=$PWD\$dir\include" >> $env:GITHUB_ENV
          Write-Host "Headers at: $PWD\$dir\include"
      - name: Set up MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Configure + build (32-bit)
        shell: pwsh
        run: |
          cmake -S . -B build -A Win32 -DCMAKE_BUILD_TYPE=Release "-DCMAKE_CXX_FLAGS=/I`"$env:VK_INCLUDE`""
          cmake --build build --config Release
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-probe-x86
          path: build/Release/vulkan_probe.exe
          if-no-files-found: error
